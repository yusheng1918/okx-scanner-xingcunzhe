name: OKX Scan Push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: okx-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            .scan_state.json
            .paper_state.json
            .zone_state.json
            signals.csv
            paper_log.csv
          key: scan-state-${{ github.run_id }}
          restore-keys: |
            scan-state-

      - name: Scan loop
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          OKX_PROXY: ""
        run: |
          END=$((SECONDS + 240))
          while [ $SECONDS -lt $END ]; do
            python scanner.py --once || true
            python zones.py --once || true
            python paper.py --once || true
            sleep 60
          done

      - name: Publish status
        if: always()
        run: |
          {
            echo "# 幸存者 · 模拟盘状态"
            echo ""
            echo "更新时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo '```'
            python paper.py --status 2>&1 || true
            echo '```'
            echo ""
            echo "## 最近成交"
            echo '```'
            tail -n 15 paper_log.csv 2>/dev/null || echo "暂无成交"
            echo '```'
          } > STATUS.md
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add STATUS.md
          git diff --cached --quiet && echo "状态无变化，跳过提交" || (git commit -m "status update [skip ci]" && git push)
