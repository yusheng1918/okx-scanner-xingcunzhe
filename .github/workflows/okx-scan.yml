name: OKX Scan Push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: okx-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state from repo
        run: |
          [ -f state/paper_state.json ] && cp state/paper_state.json .paper_state.json || true
          [ -f state/scan_state.json ] && cp state/scan_state.json .scan_state.json || true
          [ -f state/zone_state.json ] && cp state/zone_state.json .zone_state.json || true
          [ -f state/paper_log.csv ] && cp state/paper_log.csv paper_log.csv || true
          echo "状态恢复完成"

      - name: Scan loop
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          OKX_PROXY: ""
        run: |
          END=$((SECONDS + 240))
          while [ $SECONDS -lt $END ]; do
            python scanner.py --once || true
            python zones.py --once || true
            python paper.py --once || true
            sleep 60
          done

      - name: Publish status
        if: always()
        run: |
          mkdir -p state
          [ -f .paper_state.json ] && cp .paper_state.json state/paper_state.json || true
          [ -f .scan_state.json ] && cp .scan_state.json state/scan_state.json || true
          [ -f .zone_state.json ] && cp .zone_state.json state/zone_state.json || true
          [ -f paper_log.csv ] && cp paper_log.csv state/paper_log.csv || true
          {
            echo "# 幸存者 · 模拟盘状态"
            echo ""
            echo '```'
            python paper.py --status 2>&1 || true
            echo '```'
            echo ""
            echo "## 最近成交"
            echo '```'
            tail -n 15 paper_log.csv 2>/dev/null || echo "暂无成交"
            echo '```'
          } > STATUS.md
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add STATUS.md state
          git diff --cached --quiet && echo "状态无变化，跳过提交" || (git commit -m "status update [skip ci]" && git push)
